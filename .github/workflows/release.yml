name: Release

# On a version tag (v0.1.0): the lokadb binary for Linux x86-64 as a release asset with its
# SHA-256, and the image ghcr.io/lokadb/lokadb. The GitHub Action of lokadb/check downloads
# exactly these names (lokadb-linux-amd64.tar.gz and .sha256), or runs the image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binary:
    name: binary (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: proxy/go.sum
      - name: build
        working-directory: proxy
        run: CGO_ENABLED=1 go build -trimpath -o "$RUNNER_TEMP/out/lokadb" ./cmd/lokadb
      - name: package
        run: |
          cd "$RUNNER_TEMP/out"
          tar -czf lokadb-linux-amd64.tar.gz lokadb
          sha256sum lokadb-linux-amd64.tar.gz > lokadb-linux-amd64.tar.gz.sha256
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" --clobber "$RUNNER_TEMP/out/lokadb-linux-amd64.tar.gz" "$RUNNER_TEMP/out/lokadb-linux-amd64.tar.gz.sha256"

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
