; B9.11: the application -> pgbouncer (transaction pooling) -> the proxy -> Postgres. The check
; runs its proxy on port 6999 of its own container (compose run --use-aliases names it check).
[databases]
* = host=check port=6999

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; one server connection per database and user: every client shares one proxy session
default_pool_size = 1
max_client_conn = 100
max_prepared_statements = 100
server_login_retry = 1
ignore_startup_parameters = extra_float_digits
