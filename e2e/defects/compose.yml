name: lokadb-defects

# Regression checks for the defects of research/ANALYSIS.md (5.1 data loss, 5.2 security): ./defects.sh
# Test stands run Postgres with fsync, synchronous_commit and full_page_writes off (PG_FSYNC, default off):
# the data is thrown away after every run, and waiting on the disk was most of the run time.
# The data directory is a tmpfs as well (PG_DATA_TMPFS): with fsync off the stands still spent a third
# of their time waiting on the Docker disk (IO pressure 33 % full, 24.10), and nothing there is kept.
# The bench*.sh scripts set PG_FSYNC=on and move the tmpfs aside: their numbers must come from a durable
# Postgres on a real disk.
services:
  cloud:
    # pgvector and PostGIS installed (extensions after a move, M16); the same Postgres 18 otherwise
    build: {context: ./pgext, args: {PKGS: "postgresql-18-pgvector postgresql-18-postgis-3"}}
    image: lokadb-defects-pgext-cloud
    tmpfs: ["${PG_DATA_TMPFS:-/var/lib/postgresql}"] # the data in memory, see the note above services
    environment: {POSTGRES_PASSWORD: pw, PGCTLTIMEOUT: "600"}
    command: ["postgres", "-c", "wal_level=logical", "-c", "fsync=${PG_FSYNC:-off}", "-c", "synchronous_commit=${PG_FSYNC:-off}", "-c", "full_page_writes=${PG_FSYNC:-off}", "-c", "recovery_init_sync_method=syncfs"]
    healthcheck: {test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 1s, retries: 60, start_period: 600s}
  # wal_level = replica (the default): no logical replication, the move uses triggers
  cloudplain:
    image: postgres:18
    tmpfs: ["${PG_DATA_TMPFS:-/var/lib/postgresql}"] # the data in memory, see the note above services
    environment: {POSTGRES_PASSWORD: pw, PGCTLTIMEOUT: "600"}
    command: ["postgres", "-c", "fsync=${PG_FSYNC:-off}", "-c", "synchronous_commit=${PG_FSYNC:-off}", "-c", "full_page_writes=${PG_FSYNC:-off}", "-c", "recovery_init_sync_method=syncfs"]
    healthcheck: {test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 1s, retries: 60, start_period: 600s}
  # Postgres 16 with wal_level = logical: the cloud of a move whose organization runs 18 (MV33,
  # movecheckexpr.go), as in the first move of a real one
  cloud16:
    image: postgres:16
    tmpfs: ["${PG_DATA_TMPFS:-/var/lib/postgresql/data}"] # the data in memory, see the note above services
    environment: {POSTGRES_PASSWORD: pw, PGCTLTIMEOUT: "600"}
    command: ["postgres", "-c", "wal_level=logical", "-c", "fsync=${PG_FSYNC:-off}", "-c", "synchronous_commit=${PG_FSYNC:-off}", "-c", "full_page_writes=${PG_FSYNC:-off}", "-c", "recovery_init_sync_method=syncfs"]
    healthcheck: {test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 1s, retries: 60, start_period: 600s}
  customer:
    # pgvector but not PostGIS: a migration that installs PostGIS in the cloud cannot follow (M16)
    build: ./pgext
    image: lokadb-defects-pgext-customer
    tmpfs: ["${PG_DATA_TMPFS:-/var/lib/postgresql}"] # the data in memory, see the note above services
    environment: {POSTGRES_PASSWORD: pw, PGCTLTIMEOUT: "600"}
    command: ["postgres", "-c", "fsync=${PG_FSYNC:-off}", "-c", "synchronous_commit=${PG_FSYNC:-off}", "-c", "full_page_writes=${PG_FSYNC:-off}", "-c", "recovery_init_sync_method=syncfs"]
    healthcheck: {test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 1s, retries: 60, start_period: 600s}
  # PostGIS installed, as the organization's database (customergis: MV29 moves a geometry column
  # there); the plain customer has pgvector and no PostGIS
  customergis:
    build: {context: ./pgext, args: {PKGS: "postgresql-18-postgis-3"}}
    image: lokadb-defects-pgext-gis
    tmpfs: ["${PG_DATA_TMPFS:-/var/lib/postgresql}"]
    environment: {POSTGRES_PASSWORD: pw, PGCTLTIMEOUT: "600"}
    command: ["postgres", "-c", "fsync=${PG_FSYNC:-off}", "-c", "synchronous_commit=${PG_FSYNC:-off}", "-c", "full_page_writes=${PG_FSYNC:-off}"]
    healthcheck: {test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 1s, retries: 60, start_period: 600s}
  # B9.11: pgbouncer in transaction mode in front of the check's proxy (pgbouncer/pgbouncer.ini);
  # defects.sh starts it only when DEFECTS_ONLY names B9.11
  pgbouncer:
    build: ./pgbouncer
    image: lokadb-defects-pgbouncer
    profiles: [pgbouncer]
  check:
    build: {context: ../.., dockerfile: e2e/defects/Dockerfile}
    depends_on: {cloud: {condition: service_healthy}, cloudplain: {condition: service_healthy}, cloud16: {condition: service_healthy}, customer: {condition: service_healthy}, customergis: {condition: service_healthy}}
