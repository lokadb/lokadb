<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><title id="t">How far the clients go</title><desc id="d">Read plus update throughput at 200, 500 and 1000 clients: organizations in the cloud with and without lokadb, and moved organizations through fdw.</desc><rect width="760" height="356" rx="10" fill="#1a1a19"/><text x="24.0" y="30.0" font-size="16" font-weight="600" text-anchor="start" fill="#f0efec">How far the clients go</text><rect x="24.0" y="43.0" width="12" height="12" rx="3" fill="#3987e5"/><text x="42.0" y="53.0" font-size="12" font-weight="400" text-anchor="start" fill="#c3c2b7">without lokadb</text><rect x="155.0" y="43.0" width="12" height="12" rx="3" fill="#d95926"/><text x="173.0" y="53.0" font-size="12" font-weight="400" text-anchor="start" fill="#c3c2b7">through lokadb</text><text x="30.0" y="82.0" font-size="13" font-weight="600" text-anchor="start" fill="#f0efec">Organizations in the cloud</text><line x1="70.0" y1="272.0" x2="360.0" y2="272.0" stroke="#383835" stroke-width="1"/><text x="62.0" y="276.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">0</text><line x1="70.0" y1="240.0" x2="360.0" y2="240.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="244.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">20K</text><line x1="70.0" y1="208.0" x2="360.0" y2="208.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="212.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">40K</text><line x1="70.0" y1="176.0" x2="360.0" y2="176.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="180.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">60K</text><line x1="70.0" y1="144.0" x2="360.0" y2="144.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="148.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">80K</text><line x1="70.0" y1="112.0" x2="360.0" y2="112.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="116.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">100K</text><text x="62.0" y="100.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">ops/s</text><text x="90.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">200</text><text x="215.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">500</text><text x="340.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">1000</text><polyline points="90.0,138.9 215.0,139.0 340.0,153.0" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="90.0" cy="138.9" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="215.0" cy="139.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="340.0" cy="153.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="340.0" y="141.0" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">74K</text><polyline points="90.0,223.0 215.0,228.3 340.0,231.0" fill="none" stroke="#d95926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="90.0" cy="223.0" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><circle cx="215.0" cy="228.3" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><circle cx="340.0" cy="231.0" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/><text x="340.0" y="219.0" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">26K</text><text x="410.0" y="82.0" font-size="13" font-weight="600" text-anchor="start" fill="#f0efec">Moved organizations (fdw)</text><line x1="450.0" y1="272.0" x2="710.0" y2="272.0" stroke="#383835" stroke-width="1"/><text x="442.0" y="276.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">0</text><line x1="450.0" y1="240.0" x2="710.0" y2="240.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="244.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">500</text><line x1="450.0" y1="208.0" x2="710.0" y2="208.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="212.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">1K</text><line x1="450.0" y1="176.0" x2="710.0" y2="176.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="180.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">1.5K</text><line x1="450.0" y1="144.0" x2="710.0" y2="144.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="148.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">2K</text><line x1="450.0" y1="112.0" x2="710.0" y2="112.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="116.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">2.5K</text><text x="442.0" y="100.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">ops/s</text><text x="470.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">200</text><text x="580.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">500</text><text x="690.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">1000</text><polyline points="470.0,214.4 580.0,134.0 690.0,141.2" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="470.0" cy="214.4" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="580.0" cy="134.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="690.0" cy="141.2" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="690.0" y="129.2" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">2K</text><text x="410.0" y="304.0" font-size="11" font-weight="400" text-anchor="start" fill="#c3c2b7">At 1000 clients 82 % of the operations fail: the relay reaches</text><text x="410.0" y="320.0" font-size="11" font-weight="400" text-anchor="start" fill="#c3c2b7">its max_streams (2048 connections through it at once).</text><text x="24.0" y="342.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#a3a199">Read+update mix, keys never seen before, 20 organizations, 4 of them moved to databases 0.2–43 ms away.</text></svg>
