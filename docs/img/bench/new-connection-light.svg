<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><title id="t">A new connection for every request</title><desc id="d">Requests per second with a connection opened for each read, 16 clients: straight to Postgres, through pgbouncer, through lokadb without and with its connection cache.</desc><rect width="760" height="346" rx="10" fill="#fcfcfb"/><text x="24.0" y="30.0" font-size="16" font-weight="600" text-anchor="start" fill="#0b0b0b">A new connection for every request</text><text x="30.0" y="82.0" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">Requests per second (read, 16 clients)</text><line x1="70.0" y1="264.0" x2="710.0" y2="264.0" stroke="#c3c2b7" stroke-width="1"/><text x="62.0" y="268.0" font-size="11" font-weight="400" text-anchor="end" fill="#6d6b66">0</text><line x1="70.0" y1="210.7" x2="710.0" y2="210.7" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="214.7" font-size="11" font-weight="400" text-anchor="end" fill="#6d6b66">1K</text><line x1="70.0" y1="157.3" x2="710.0" y2="157.3" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="161.3" font-size="11" font-weight="400" text-anchor="end" fill="#6d6b66">2K</text><line x1="70.0" y1="104.0" x2="710.0" y2="104.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="108.0" font-size="11" font-weight="400" text-anchor="end" fill="#6d6b66">3K</text><text x="62.0" y="92.0" font-size="11" font-weight="400" text-anchor="end" fill="#6d6b66">req/s</text><path d="M138.0,264.0 L138.0,197.5 Q138.0,193.5 142.0,193.5 L158.0,193.5 Q162.0,193.5 162.0,197.5 L162.0,264.0 Z" fill="#2a78d6"/><text x="150.0" y="187.5" font-size="12" font-weight="400" text-anchor="middle" fill="#0b0b0b">1.3K</text><text x="150.0" y="282.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">straight to</text><text x="150.0" y="297.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">Postgres</text><path d="M298.0,264.0 L298.0,253.3 Q298.0,249.3 302.0,249.3 L318.0,249.3 Q322.0,249.3 322.0,253.3 L322.0,264.0 Z" fill="#2a78d6"/><text x="310.0" y="243.3" font-size="12" font-weight="400" text-anchor="middle" fill="#0b0b0b">275</text><text x="310.0" y="282.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">pgbouncer</text><text x="310.0" y="297.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">(transaction)</text><path d="M458.0,264.0 L458.0,224.2 Q458.0,220.2 462.0,220.2 L478.0,220.2 Q482.0,220.2 482.0,224.2 L482.0,264.0 Z" fill="#2a78d6"/><text x="470.0" y="214.2" font-size="12" font-weight="400" text-anchor="middle" fill="#0b0b0b">821</text><text x="470.0" y="282.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">lokadb,</text><text x="470.0" y="297.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">no pool</text><path d="M618.0,264.0 L618.0,119.0 Q618.0,115.0 622.0,115.0 L638.0,115.0 Q642.0,115.0 642.0,119.0 L642.0,264.0 Z" fill="#eb6834"/><text x="630.0" y="109.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0b0b0b">2.8K</text><text x="630.0" y="282.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">lokadb, pool</text><text x="630.0" y="297.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">(the default)</text><text x="24.0" y="330.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#6d6b66">The pool is on by default; pgbouncer here is our plain setup (scram, one process, pool of 32), not its best case.</text></svg>
