<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><title id="t">What overload looks like</title><desc id="d">Median latency of reads and the share of timeouts through the proxy when requests arrive at a set rate of 17 500 to 25 000 per second, read plus update.</desc><rect width="760" height="352" rx="10" fill="#1a1a19"/><text x="24.0" y="30.0" font-size="16" font-weight="600" text-anchor="start" fill="#f0efec">What overload looks like</text><rect x="24.0" y="43.0" width="12" height="12" rx="3" fill="#3987e5"/><text x="42.0" y="53.0" font-size="12" font-weight="400" text-anchor="start" fill="#c3c2b7">through lokadb</text><rect x="155.0" y="43.0" width="12" height="12" rx="3" fill="#d95926"/><text x="173.0" y="53.0" font-size="12" font-weight="400" text-anchor="start" fill="#c3c2b7">without lokadb</text><text x="30.0" y="82.0" font-size="13" font-weight="600" text-anchor="start" fill="#f0efec">Median latency of a read</text><line x1="70.0" y1="272.0" x2="370.0" y2="272.0" stroke="#383835" stroke-width="1"/><text x="62.0" y="276.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">0</text><line x1="70.0" y1="232.0" x2="370.0" y2="232.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="236.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">100</text><line x1="70.0" y1="192.0" x2="370.0" y2="192.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="196.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">200</text><line x1="70.0" y1="152.0" x2="370.0" y2="152.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="156.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">300</text><line x1="70.0" y1="112.0" x2="370.0" y2="112.0" stroke="#2c2c2a" stroke-width="1"/><text x="62.0" y="116.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">400</text><text x="62.0" y="100.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">ms</text><text x="100.0" y="266.6" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">1.1</text><text x="100.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">17.5K</text><path d="M148.0,272.0 L148.0,272.0 Q148.0,271.4 148.6,271.4 L171.4,271.4 Q172.0,271.4 172.0,272.0 L172.0,272.0 Z" fill="#3987e5"/><text x="160.0" y="266.4" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">1.6</text><text x="160.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">20K</text><path d="M208.0,272.0 L208.0,272.0 Q208.0,269.4 210.6,269.4 L229.4,269.4 Q232.0,269.4 232.0,272.0 L232.0,272.0 Z" fill="#3987e5"/><text x="220.0" y="264.4" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">6.5</text><text x="220.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">22.5K</text><path d="M268.0,272.0 L268.0,140.1 Q268.0,136.1 272.0,136.1 L288.0,136.1 Q292.0,136.1 292.0,140.1 L292.0,272.0 Z" fill="#3987e5"/><text x="280.0" y="131.1" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">340</text><text x="280.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">25K</text><text x="340.0" y="266.8" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">0.42</text><text x="340.0" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">25K plain</text><text x="410.0" y="82.0" font-size="13" font-weight="600" text-anchor="start" fill="#f0efec">Requests that timed out</text><line x1="450.0" y1="272.0" x2="720.0" y2="272.0" stroke="#383835" stroke-width="1"/><text x="442.0" y="276.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">0</text><line x1="450.0" y1="232.0" x2="720.0" y2="232.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="236.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">1</text><line x1="450.0" y1="192.0" x2="720.0" y2="192.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="196.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">2</text><line x1="450.0" y1="152.0" x2="720.0" y2="152.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="156.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">3</text><line x1="450.0" y1="112.0" x2="720.0" y2="112.0" stroke="#2c2c2a" stroke-width="1"/><text x="442.0" y="116.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">4</text><text x="442.0" y="100.0" font-size="11" font-weight="400" text-anchor="end" fill="#a3a199">%</text><path d="M471.8,272.0 L471.8,259.5 Q471.8,255.5 475.8,255.5 L491.8,255.5 Q495.8,255.5 495.8,259.5 L495.8,272.0 Z" fill="#3987e5"/><text x="483.8" y="250.5" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">0.4</text><text x="483.8" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">17.5K</text><path d="M539.2,272.0 L539.2,239.8 Q539.2,235.8 543.2,235.8 L559.2,235.8 Q563.2,235.8 563.2,239.8 L563.2,272.0 Z" fill="#3987e5"/><text x="551.2" y="230.8" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">0.9</text><text x="551.2" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">20K</text><path d="M606.8,272.0 L606.8,256.8 Q606.8,252.8 610.8,252.8 L626.8,252.8 Q630.8,252.8 630.8,256.8 L630.8,272.0 Z" fill="#3987e5"/><text x="618.8" y="247.8" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">0.5</text><text x="618.8" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">22.5K</text><path d="M674.2,272.0 L674.2,135.5 Q674.2,131.5 678.2,131.5 L694.2,131.5 Q698.2,131.5 698.2,135.5 L698.2,272.0 Z" fill="#3987e5"/><text x="686.2" y="126.5" font-size="11" font-weight="400" text-anchor="middle" fill="#f0efec">3.5</text><text x="686.2" y="290.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">25K</text><text x="24.0" y="312.0" font-size="11" font-weight="400" text-anchor="start" fill="#c3c2b7">Requests arrive at the offered rate (read plus update per second) whether or not the earlier ones were answered.</text><text x="24.0" y="334.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#a3a199">256 workers, a request not started or not answered in 1 s is a timeout; the ceiling of the closed loop is 24-30K ops/s.</text></svg>
